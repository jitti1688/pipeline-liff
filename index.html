<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Pipeline</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { background-color: #f8f9fa; font-family: 'Sarabun', sans-serif; }
    .card { border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .btn-line { background-color: #06C755; color: white; border: none; }
    .page-section { display: none; }
  </style>
</head>
<body>
  <div class="container mt-4 mb-5">
    <div id="page-loading" class="text-center mt-5">
      <div class="spinner-border text-primary mb-3" role="status"></div>
      <h5 class="text-primary" id="loading-text">กำลังเรียก LIFF SDK...</h5>
    </div>

    <div id="page-form" class="page-section card p-4">
      <div class="alert alert-success text-center">
        <strong>✅ เชื่อมต่อ LINE สำเร็จ!</strong><br>
        ชื่อผู้ใช้งาน: <span id="showName" class="text-primary fw-bold"></span>
      </div>
      <h5 class="text-primary mb-3">สร้างรายการ Pipeline ใหม่</h5>
      <form id="pipelineForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="uid" name="uid">
        <input type="hidden" id="ownerName" name="ownerName">
        
        <div class="mb-3"><label class="form-label">กองที่รับผิดชอบ</label><select class="form-select" id="division" name="division" required></select></div>
        <div class="mb-3"><label class="form-label">ชื่อโครงการ</label><input type="text" class="form-control" name="projectName" required></div>
        <div class="mb-3"><label class="form-label">ลูกค้า</label><input type="text" class="form-control" name="customer" required></div>
        <div class="mb-3"><label class="form-label">ประเทศ</label><input type="text" class="form-control" name="country" required></div>
        <div class="mb-3"><label class="form-label">มูลค่าโครงการ</label><input type="number" class="form-control" name="projectValue" required></div>
        <div class="mb-3"><label class="form-label">รายได้ปีงบประมาณ</label><input type="text" class="form-control" name="fiscalYear" required></div>
        <div class="mb-3"><label class="form-label">สถานะโครงการ</label><select class="form-select" id="status" name="status" required></select></div>
        <div class="mb-3"><label class="form-label">โอกาสความน่าจะเป็น</label><select class="form-select" id="probability" name="probability" required></select></div>
        <div class="mb-3"><label class="form-label">บันทึกเพิ่มเติม</label><textarea class="form-control" name="remark" rows="3"></textarea></div>
        
        <button type="submit" id="btnSubmit" class="btn btn-line w-100 py-3 fs-5 mt-4">บันทึกข้อมูล</button>
      </form>
    </div>
  </div>

  <script>
    // === ⚠️ เอา URL จาก Google Apps Script (ลงท้าย /exec) มาใส่ตรงนี้ ⚠️ ===
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby8lZ5hYGd72O1kxiwgzLOflzzEedb_77HDnC4IXclsUO91aGIDTmASAh4CYsRTFO-j/exec"; 

    async function initializeLiff() {
      try {
        await liff.init({ liffId: "2012060852-adaxUYUO" });
        if (!liff.isLoggedIn()) {
          document.getElementById('loading-text').innerText = "กำลังพาไปล็อกอิน...";
          liff.login();
        } else {
          document.getElementById('loading-text').innerText = "กำลังดึงข้อมูลโปรไฟล์...";
          const profile = await liff.getProfile();
          
          document.getElementById('showName').innerText = profile.displayName;
          document.getElementById('uid').value = profile.userId;
          document.getElementById('ownerName').value = profile.displayName;
          
          loadDropdowns();
          document.getElementById('page-loading').style.display = 'none';
          document.getElementById('page-form').style.display = 'block';
        }
      } catch (err) {
        alert("LIFF Error: " + err);
        document.getElementById('loading-text').innerHTML = `<span class="text-danger">เกิดข้อผิดพลาด: ${err}</span>`;
      }
    }

    async function loadDropdowns() {
      try {
        const res = await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getSettings' })
        });
        const data = await res.json();
        if(data.success) {
          populateSelect('division', data.divisions);
          populateSelect('status', data.statuses);
          populateSelect('probability', data.probabilities);
        } else {
          alert("ดึงข้อมูลตัวเลือกผิดพลาด: " + data.message);
        }
      } catch(e) { console.error("Fetch Error:", e); }
    }

    function populateSelect(elementId, arrayData) {
      const select = document.getElementById(elementId);
      select.innerHTML = '<option value="">-- เลือก --</option>';
      arrayData.forEach(item => {
        let option = document.createElement('option');
        option.value = item; option.text = item; select.appendChild(option);
      });
    }

    async function handleFormSubmit(event) {
      event.preventDefault();
      document.getElementById('btnSubmit').disabled = true;
      document.getElementById('btnSubmit').innerText = 'กำลังบันทึก...';
      
      const form = document.getElementById('pipelineForm');
      const dataObj = Object.fromEntries(new FormData(form).entries());
      
      try {
        const res = await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'saveData', payload: dataObj })
        });
        const result = await res.json();
        if(result.success) { 
          alert('บันทึกสำเร็จ!'); 
          form.reset(); 
        } else { 
          alert('บันทึกล้มเหลว: ' + result.message); 
        }
      } catch(e) {
        alert("เกิดข้อผิดพลาดในการส่งข้อมูล: " + e);
      } finally {
        document.getElementById('btnSubmit').disabled = false;
        document.getElementById('btnSubmit').innerText = 'บันทึกข้อมูล';
      }
    }

    window.onload = () => { initializeLiff(); };
  </script>
</body>
</html>
